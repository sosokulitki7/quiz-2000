<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мега-квиз 2000-х</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2d;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e334d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, #1e2235 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .window {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .title-bar {
            background: #141724;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
        }

        .music-btn {
            background: #24283b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: 0.15s;
        }

        .music-btn:hover {
            border-color: var(--accent);
            background: #2d324a;
        }

        .content {
            padding: 28px;
        }

        #progress {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #818cf8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h2, h3 {
            margin-top: 0;
            line-height: 1.4;
            font-weight: 600;
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px 18px;
            background: #24283b;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
        }

        .btn:hover:not(:disabled) {
            background: #2d324a;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .btn:disabled {
            cursor: default;
        }

        #result-box .btn {
            background: var(--accent);
            border-color: var(--accent);
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
        }

        #result-box .btn:hover {
            background: var(--accent-hover);
        }

        .status-bar {
            background: #141724;
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>

<div class="window">
    <div class="title-bar">
        <span>QUIZ_2000 // PARTY</span>
        <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🔇 Звук: ВЫКЛ</button>
    </div>
    
    <div class="content" id="quiz-box">
        <div id="progress">Загрузка...</div>
        <h3 id="question">Подключаемся к серверу 2000-х...</h3>
        <div id="options"></div>
    </div>

    <div class="content hidden" id="result-box">
        <h2>Раунд завершен!</h2>
        <p id="score-text" style="font-size: 18px; color: #818cf8; font-weight: 600;"></p>
        <button class="btn" onclick="startNewRound()">Сыграть новый раунд</button>
    </div>

    <div class="status-bar">
        <span>Статус: Онлайн</span>
        <span>Вопросов в базе: <strong id="total-db-count" style="color: #f3f4f6;">0</strong></span>
    </div>
</div>

<script>
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');
    music.volume = 0.3; // Комфортная громкость 30%

    function toggleMusic() {
        if (music.paused) {
            music.play();
            musicBtn.innerText = '🔊 Звук: ВКЛ';
        } else {
            music.pause();
            musicBtn.innerText = '🔇 Звук: ВЫКЛ';
        }
    }
</script>
<script src="app.js"></script>
</body>
</html>
